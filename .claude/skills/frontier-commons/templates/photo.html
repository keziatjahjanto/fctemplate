<!-- default-theme: mist -->
<!-- fields: image*, tag, headline*, caption -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="{{{base_css}}}">
<style>
  .wrap { position: absolute; inset: var(--pad); bottom: calc(var(--pad) + var(--footer)); display: flex; flex-direction: column; gap: calc(var(--u) * 4); }
  .media { flex: 1; min-height: 0; }
  .text { display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); padding-right: calc(var(--u) * 30); }
  .aspect-wide .wrap { flex-direction: row; } .aspect-wide .media { flex: 0 0 56%; }
  .aspect-wide .text { justify-content: center; padding-right: 0; }
  .aspect-tall .text { padding-right: 0; }
  .subtitle { font-size: calc(var(--u) * 5); }
</style></head>
<body class="theme-{{theme}} aspect-{{aspect}} {{^logo}}no-logo{{/logo}}">
  <div class="wrap">
    <div class="media"><img class="photo" src="{{{image}}}"></div>
    <div class="text">
      {{#tag}}<div><span class="tag">{{tag}}</span></div>{{/tag}}
      <div class="subtitle">{{headline}}</div>
      {{#caption}}<div class="body-text" style="color: var(--muted)">{{caption}}</div>{{/caption}}
    </div>
  </div>
  <div class="logo-slot">{{{logo}}}</div>
</body></html>
