<!-- default-theme: mist -->
<!-- fields: layout (horizontal|stacked). Exports the wordmark lockup; use with "transparent": true -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="{{{base_css}}}">
<style>
  html, body { background: transparent !important; }
  body { display: grid; place-items: center; --u: calc(min(100vw, 100vh) / 100); }
  .wordmark img { height: calc(var(--u) * 70); } .wordmark span { font-size: calc(var(--u) * 36); } .wordmark { gap: calc(var(--u) * 22); }
  .stacked { --u: calc(min(100vw, 100vh) / 100); }
  .stacked .wordmark { flex-direction: column; gap: calc(var(--u) * 7); }
  .stacked .wordmark img { height: calc(var(--u) * 27); }
  .stacked .wordmark span { font-size: calc(var(--u) * 13); white-space: normal; text-align: center; width: 7.5em; line-height: 1.1; }
</style></head>
<body class="theme-{{theme}} {{layout}}">{{{logo}}}</body></html>
